<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swing & Breakout Auto-Picks — IND / US</title>
<style>
:root{--bg:#0b0f14;--p:#121923;--b:#1f2a37;--t:#d6e0ee;--m:#7d8da1;--g:#22c55e;--r:#ef4444;--y:#f5b942;--a:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b);background:var(--p)}
h1{font-size:16px;margin:0;color:var(--a)}h3{margin:0 0 8px;font-size:13px;color:var(--a)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
button,select,input{background:#0e1520;color:var(--t);border:1px solid var(--b);border-radius:5px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.on{background:var(--a);color:#001018;border-color:var(--a);font-weight:700}
button.pri{background:var(--g);color:#00150a;border-color:var(--g);font-weight:700}
main{padding:12px 14px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px;margin-bottom:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{padding:5px 7px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}th{color:var(--m);font-weight:600}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.m{color:var(--m)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.k{background:var(--p);border:1px solid var(--b);border-radius:6px;padding:8px}.k b{display:block;font-size:16px}
.why{white-space:normal;text-align:left;color:var(--m);font-size:12px;min-width:240px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.f label{display:block;color:var(--m);font-size:11px}.f input{width:100%}
footer{text-align:center;color:var(--m);padding:14px}
</style></head><body>
<header><h1>⚡ Swing & Breakout Auto-Picks</h1><div class="tabs" id="tabs"></div></header>
<main id="app"></main>
<footer>⚡ Powered by Sethu · Paper trading only, not financial advice · Prices: Yahoo Finance (may be delayed)</footer>
<script>
const $=s=>document.querySelector(s);
const U={IND:{cur:'₹',sfx:'.NS',loc:'en-IN',liq:5e7,list:'RELIANCE,TCS,HDFCBANK,ICICIBANK,INFY,BHARTIARTL,SBIN,LT,ITC,AXISBANK,KOTAKBANK,M&M,SUNPHARMA,BAJFINANCE,MARUTI,NTPC,POWERGRID,ONGC,TITAN,ADANIPORTS,HAL,BEL,TRENT,DLF,COALINDIA,JSWSTEEL,TATASTEEL,CIPLA,EICHERMOT,PERSISTENT,POLYCAB,INDIGO,ETERNAL,CHOLAFIN,MUTHOOTFIN,PFC,RECLTD,BSE,DIXON,CGPOWER,HDFCLIFE,SBILIFE,BAJAJFINSV,TECHM,WIPRO,HCLTECH,GRASIM,ULTRACEMCO,HINDALCO,VEDL,TVSMOTOR,BHARATFORG,LUPIN,TORNTPHARM,ABB,SIEMENS,JINDALSTEL,IRCTC,PNB,CANBK'.split(',')},
US:{cur:'$',sfx:'',loc:'en-US',liq:2e7,list:'AAPL,MSFT,NVDA,AMZN,GOOGL,META,AVGO,TSLA,JPM,V,LLY,COST,NFLX,AMD,CRM,ORCL,PLTR,UBER,SHOP,PANW,CRWD,NOW,ANET,APP,HOOD,COIN,MU,GE,CAT,WMT,ADBE,INTU,ISRG,UNH,HD,MA,BKNG,TXN,QCOM,AMAT,LRCX,KLAC,SNPS,CDNS,DDOG,NET,SNOW,ABNB,DASH,RKLB'.split(',')}};
const D={set:{capIND:1000000,capUS:10000,risk:1,maxOpen:5,minScore:70,auto:1,lock:0.3,trail:2,gh:{tok:'',repo:'',path:'paper-trades.json',branch:'main'}},pos:[],picks:{}};
let S=Object.assign({},D,JSON.parse(localStorage.getItem('sba1')||'{}'));S.set=Object.assign({},D.set,S.set);S.set.gh=Object.assign({},D.set.gh,S.set.gh);
const V={tab:'picks',mk:'IND'};let busy=0;
const save=()=>localStorage.setItem('sba1',JSON.stringify(S));
const today=()=>new Date().toISOString().slice(0,10);
const f=(x,mk=V.mk)=>x==null||isNaN(x)?'–':x.toLocaleString(U[mk].loc,{maximumFractionDigits:2,minimumFractionDigits:2});
const cl=x=>x>0?'g':x<0?'r':'';

/* ---------- data (real prices only, via CORS-proxy race) ---------- */
const PX=[u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const okj=async r=>{if(!r.ok)throw 0;const j=await r.json();if(!j.chart||!j.chart.result)throw 0;return j.chart.result[0]};
const getJSON=url=>Promise.any([url,...PX.map(p=>p(url))].map(u=>fetch(u,{signal:AbortSignal.timeout(15000)}).then(okj)));
const yurl=(s,r)=>`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?range=${r}&interval=1d`;
async function bars(s){const r=await getJSON(yurl(s,'1y')),q=r.indicators.quote[0],B={c:[],h:[],l:[],v:[]};
 r.timestamp.forEach((_,i)=>{if(q.close[i]!=null&&q.high[i]!=null&&q.low[i]!=null){B.c.push(q.close[i]);B.h.push(q.high[i]);B.l.push(q.low[i]);B.v.push(q.volume[i]||0)}});
 B.last=r.meta.regularMarketPrice||B.c.at(-1);return B}
const FD={};
async function fileData(mk){if(FD[mk]!==undefined)return FD[mk];const g=S.set.gh,us=[`data/${mk}.json`];if(g.repo)us.push(`https://raw.githubusercontent.com/${g.repo}/${g.branch||'main'}/data/${mk}.json`);
 for(const u of us){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.s)return FD[mk]=j}}catch(e){}}return FD[mk]=null}
async function quote(p){try{const m=(await getJSON(yurl(p.ys,'5d'))).meta;return{px:m.regularMarketPrice,dh:m.regularMarketDayHigh,dl:m.regularMarketDayLow}}
 catch(e){const F=await fileData(p.mk),B=F&&F.s[p.sym];if(!B)throw e;const n=B.c.length-1;return{px:B.last,dh:B.h[n],dl:B.l[n]}}}

/* ---------- indicators + setups ---------- */
const sma=(a,n,e=a.length)=>a.slice(e-n,e).reduce((x,y)=>x+y,0)/n;
const rsi=(c,n=14)=>{let g=0,l=0;for(let i=c.length-n;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100};
const atr=(B,n=14)=>{let s=0;for(let i=B.c.length-n;i<B.c.length;i++)s+=Math.max(B.h[i]-B.l[i],Math.abs(B.h[i]-B.c[i-1]),Math.abs(B.l[i]-B.c[i-1]));return s/n};
const cl01=(x,m)=>Math.max(0,Math.min(m,x));
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>i?e=x*k+e*(1-k):x)};
const regime=i=>{if(!i||i.length<200)return null;const P=i.at(-1);return P>sma(i,50)&&P>sma(i,200)?'Bullish':P>sma(i,200)?'Cautious':'Weak'};
const fscore=f=>f?[f.eg>0.1,f.rg>0.1,f.roe>0.12,f.de!=null&&f.de<100,f.pm>0.08].filter(Boolean).length:null;
function analyze(B,mk,I,f){
 const c=B.c,n=c.length;if(n<70)return null;
 const P=B.last,s20=sma(c,20),s50=sma(c,50),s50o=sma(c,50,n-10),a=atr(B),r=rsi(c);
 if(sma(B.v,20)*P<U[mk].liq)return{none:1,above:P>s50};
 const hiP=Math.max(...B.h.slice(n-51,n-1)),hi50=Math.max(...B.h.slice(n-50));
 const vr=B.v[n-1]/sma(B.v,20),v5=sma(B.v,5)/sma(B.v,20),mom=P/c[n-64]-1;
 const rg=k=>(Math.max(...B.h.slice(n-k))-Math.min(...B.l.slice(n-k)))/P,bx=(x,y)=>(Math.max(...B.h.slice(n-x,n-y))-Math.min(...B.l.slice(n-x,n-y)))/P;
 const up=P>s50&&s20>s50&&s50>s50o,d=(hi50-P)/hi50,why=[],s200=n>=200?sma(c,200):null;let type,pat=0,e=P;
 const st2=n>=200&&P>s200&&s50>s200&&s200>sma(c,200,n-20),rs=I&&I.length>64?mom-(I.at(-1)/I.at(-64)-1):null;
 const e12=ema(c,12),e26=ema(c,26),ml=e12.map((x,i)=>x-e26[i]),sg=ema(ml,9),mh=ml[n-1]-sg[n-1],macdUp=mh>0&&mh>ml[n-2]-sg[n-2];
 const vcp=bx(5,0)<bx(10,5)&&bx(10,5)<bx(15,10),pole=c[n-6]/Math.min(...c.slice(n-36,n-6))-1,flag=pole>=0.2&&rg(8)<=0.09&&d<=0.06;
 const fs=fscore(f),earn=f&&f.ed?Math.round((new Date(f.ed)-Date.now())/864e5):null,okRS=rs==null||rs>0;
 if(st2)why.push('Long-term uptrend confirmed (above rising 200-day average)');else if(up)why.push('Medium-term uptrend (above 50-day)');
 if(rs!=null)why.push(`${rs>0?'Beating':'Lagging'} its index by ${Math.abs(rs*100).toFixed(0)}% over 3 months`);
 if(P>hiP&&vr>=1.3&&r<78&&P<hiP*1.04&&st2&&okRS){type='Breakout Live';pat=18;why.push(`Just pushed above its 50-day high on ${vr.toFixed(1)}x normal volume`)}
 else if(up&&st2&&okRS&&d>=0&&d<=0.04&&(rg(5)<rg(20)*0.55||vcp||flag)&&v5<1.1&&r>=50&&r<=72){type='Breakout Ready';pat=18;e=hi50*1.002;why.push(`Only ${(d*100).toFixed(1)}% below its 50-day high`,'Price is squeezing tighter: buy only if it crosses the Entry price')}
 else if(up&&st2&&(rs==null||rs>-0.02)&&Math.abs(P/s20-1)<=0.035&&r>=38&&r<=56&&c[n-1]>c[n-2]){type='Swing Pullback';pat=16;why.push('Healthy dip to its 20-day average, now bouncing',`RSI ${r.toFixed(0)}: cooled off, not overheated`)}
 if(!type)return{none:1,above:P>s50};
 const lo10=Math.min(...B.l.slice(-10)),sl=Math.min(e-a,Math.max(e-2.2*a,lo10-0.1*a)),R=e-sl;
 if(R<=0||R/e>0.1)return{none:1,above:P>s50};
 if(vcp)why.push('Volatility contraction: each 5-day swing smaller than the last (VCP-style)');
 if(flag)why.push(`Bull-flag: ${(pole*100).toFixed(0)}% run then a tight pause`);
 if(macdUp)why.push('MACD momentum turning up');
 why.push(fs==null?'Fundamentals not loaded (run data feed)':`Fundamentals ${fs}/5 (growth, returns, debt, margins)`);
 if(earn!=null&&earn>=0&&earn<=7)why.push(`⚠ Earnings in ${earn} days: skipped for auto-trade`);
 const vol=type=='Breakout Live'?cl01(vr*5,10):cl01((1.2-v5)*14,10);
 const score=Math.round((st2?15:7)+10+pat+(vcp?3:0)+(flag?3:0)+vol+(rs==null?5:cl01(rs*50,15))+cl01(8-Math.abs(r-58)*0.3,8)+(macdUp?4:0)+(fs==null?0:fs*2));
 return{type,score,P,entry:e,sl,t1:e+1.5*R,t2:e+3*R,atr:a,why,above:P>s50,rsi:r,rs,fs,earn};
}

/* ---------- paper trading engine ---------- */
const act=mk=>S.pos.filter(p=>p.mk==mk&&(p.st=='OPEN'||p.st=='PENDING'));
function acct(mk){const cap=S.set['cap'+mk],ps=S.pos.filter(p=>p.mk==mk);let real=0,un=0,inv=0,w=0,n=0;
 ps.forEach(p=>{real+=p.real;if(p.st=='CLOSED'){n++;if(p.real>0)w++}if(p.st=='OPEN'){un+=((p.px||p.entry)-p.entry)*p.rem}if(p.st=='OPEN'||p.st=='PENDING')inv+=p.entry*p.rem});
 return{cap,real,un,eq:cap+real+un,free:cap+real-inv,w,n,open:act(mk).length}}
function addPos(mk,k,auto){const q=S.picks[mk].list[k],ys=q.ys,a=acct(mk);
 if(act(mk).some(p=>p.ys==ys))return 0;if(act(mk).length>=S.set.maxOpen&&auto)return 0;
 const risk=S.set['cap'+mk]*S.set.risk/100,qty=Math.floor(Math.min(risk/(q.entry-q.sl),S.set['cap'+mk]*0.25/q.entry));
 if(qty<1||qty*q.entry>a.free)return 0;const pend=q.type=='Breakout Ready';
 S.pos.push({id:Date.now()+k,mk,sym:q.sym,ys,type:q.type,st:pend?'PENDING':'OPEN',entry:q.entry,sl:q.sl,sl0:q.sl,t1:q.t1,t2:q.t2,qty,rem:qty,real:0,atr:q.atr,hh:q.entry,d0:pend?null:today(),created:Date.now(),stage:0,t1h:0,px:q.P,log:[pend?'Waiting for breakout above entry':'Entered at '+f(q.entry,mk)]});return 1}
function exit(p,price,why){p.real+=(price-p.entry)*p.rem;p.rem=0;p.st='CLOSED';p.exit=price;p.why=why;p.closed=Date.now();p.log.push(why+' @ '+f(price,p.mk))}
function step(p,q){const T=today(),px=q.px;p.px=px;
 if(p.st=='PENDING'){if(px>=p.entry){p.st='OPEN';p.d0=T;p.hh=px;p.log.push('Breakout triggered')}else if(px<=p.sl||Date.now()-p.created>10*864e5){p.st='CANCELLED';p.log.push('Setup failed/expired before triggering: no money used')}return}
 if(p.st!='OPEN')return;const R=p.entry-p.sl0,same=p.d0==T,lo=same?px:Math.min(px,q.dl||px),hi=same?px:Math.max(px,q.dh||px);p.hh=Math.max(p.hh,hi);
 if(lo<=p.sl){exit(p,px<p.sl?px:p.sl,p.sl>=p.entry?'Trailing stop (profit locked)':'Stop-loss hit');return}
 if(!p.t1h&&hi>=p.t1){const h=Math.floor(p.qty/2);p.real+=(p.t1-p.entry)*h;p.rem-=h;p.t1h=1;p.stage=2;p.sl=Math.max(p.sl,p.entry+0.75*R);p.log.push('Target 1 hit: half sold, stop raised')}
 if(hi>=p.t2){exit(p,p.t2,'Target 2 hit');return}
 if(hi>=p.entry+0.8*R&&p.stage<1){p.stage=1;p.sl=Math.max(p.sl,p.entry+S.set.lock*R);p.log.push('Up 0.8R: stop moved above entry to lock minimum profit')}
 if(p.stage>=1)p.sl=Math.max(p.sl,p.hh-S.set.trail*p.atr);
 if(Date.now()-new Date(p.d0)>30*864e5)exit(p,px,'Time exit (30 days)')}
async function refresh(){const ps=S.pos.filter(p=>p.st=='OPEN'||p.st=='PENDING');if(!ps.length||busy)return;busy=1;msg('Refreshing prices…');
 delete FD.IND;delete FD.US;const u={},Q={};ps.forEach(p=>u[p.ys]=p);await Promise.allSettled(Object.entries(u).map(async([y,p])=>Q[y]=await quote(p)));
 ps.forEach(p=>Q[p.ys]&&step(p,Q[p.ys]));busy=0;save();msg('Prices updated '+new Date().toLocaleTimeString());R()}

/* ---------- scanner ---------- */
async function scan(mk){if(busy)return;busy=1;delete FD[mk];const F=await fileData(mk),reg=regime(F&&F.i),L=U[mk].list,q=[...L],list=[],fails=[];let done=0,up=0,tot=0;
 await Promise.all(Array.from({length:6},async()=>{while(q.length){const s=q.shift(),ys=s+U[mk].sfx;
  try{const D=F&&F.s[s],a=analyze(D||await bars(ys),mk,F&&F.i,D&&D.f);if(a){tot++;a.above&&up++;if(!a.none)list.push({...a,sym:s,ys})}}catch(e){fails.push(s)}
  msg(`Scanning ${mk}: ${++done}/${L.length}`)}}));
 list.sort((x,y)=>y.score-x.score);S.picks[mk]={list,at:Date.now(),breadth:tot?Math.round(up/tot*100):null,fails,tot,reg};
 let add=0;if(S.set.auto&&tot&&reg!='Weak')list.filter(x=>x.score>=S.set.minScore+(reg=='Cautious'?5:0)&&!(x.earn!=null&&x.earn>=0&&x.earn<=7)).forEach((x,i)=>{add+=addPos(mk,list.indexOf(x),1)});
 busy=0;save();R();msg(tot?`${mk} scan done (${F?'GitHub data from '+new Date(F.t*1000).toLocaleString():'live proxies'}): ${list.length} picks, ${add} auto-added`+(fails.length?`, ${fails.length} failed`:''):'No prices could be loaded. Set up the GitHub data feed (see instructions).')}
const msg=t=>{const e=$('#st');if(e)e.textContent=t};

/* ---------- views ---------- */
function mkBar(){return`<div class="row">${['IND','US'].map(m=>`<button class="${V.mk==m?'on':''}" onclick="V.mk='${m}';R()">${m=='IND'?'🇮🇳 India (NSE)':'🇺🇸 US'}</button>`).join('')}<span class="m" id="st"></span></div>`}
function picksView(){const mk=V.mk,P=S.picks[mk],c=U[mk].cur,mood=P&&P.breadth!=null?P.breadth:null,reg=P&&P.reg;
 const tag=t=>`<span class="tag ${t=='Swing Pullback'?'y':'g'}">${t}</span>`;
 return`<div class="row"><button class="pri" onclick="scan('${mk}')">🔍 Scan ${mk} now</button><button onclick="R()">↻</button></div>
<div class="grid"><div class="k">Market mood<b class="${mood>=60?'g':mood<40?'r':'y'}">${mood==null?'–':mood+'% stocks in uptrend'}</b><span class="m">${mood>=60?'Good time for breakouts':mood<40?'Weak: be extra careful':'Mixed: be selective'}</span></div>
<div class="k">Index trend<b class="${reg=='Bullish'?'g':reg=='Weak'?'r':'y'}">${reg||'n/a'}</b><span class="m">${reg=='Weak'?'Index below 200-day: auto-add paused':reg=='Cautious'?'Stricter: min score +5':reg=='Bullish'?'Index above 50 & 200-day':'Needs the GitHub data feed'}</span></div>
<div class="k">Picks found<b>${P?P.list.length:'–'}</b><span class="m">${P?new Date(P.at).toLocaleString():'Press Scan'}</span></div>
<div class="k">Auto-add rule<b>${S.set.auto?'ON':'OFF'}</b><span class="m">Score ≥ ${S.set.minScore}, max ${S.set.maxOpen} open</span></div></div>
<div class="card"><h3>How to read this (no experience needed)</h3><div class="m">• <b>Breakout Ready</b>: stock is coiling near a high. Paper trade waits and only buys if price crosses <b>Entry</b>.<br>• <b>Breakout Live</b>: just broke out with big volume.<br>• <b>Swing Pullback</b>: a rising stock took a small dip and bounced.<br>• <b>SL</b> = exit if wrong. <b>T1</b> = sell half and protect the trade. <b>T2</b> = sell the rest. Score is out of 100 (70+ is good). <b>RS</b> = how much it beat its index over 3 months. <b>Fund</b> = business quality out of 5.</div></div>
<div class="card"><table><tr><th>Stock</th><th class="l">Setup</th><th>Score</th><th>RS</th><th>Fund</th><th>Entry</th><th>SL</th><th>T1</th><th>T2</th><th>Risk</th><th class="l">Why</th><th></th></tr>
${P?P.list.map((x,i)=>`<tr><td><b>${x.sym}</b></td><td class="l">${tag(x.type)}</td><td class="${x.score>=80?'g':x.score>=70?'y':'m'}"><b>${x.score}</b></td><td class="${cl(x.rs)}">${x.rs==null?'–':(x.rs*100).toFixed(0)+'%'}</td><td>${x.fs==null?'–':x.fs+'/5'}</td><td>${c}${f(x.entry)}</td><td class="r">${f(x.sl)}</td><td class="g">${f(x.t1)}</td><td class="g">${f(x.t2)}</td><td>${((x.entry-x.sl)/x.entry*100).toFixed(1)}%</td><td class="why">${x.why.join('. ')}</td><td><button onclick="manual('${mk}',${i})">+ Paper</button></td></tr>`).join('')||(P.tot?'<tr><td colspan=12 class="m">No clean setups right now. That is normal: no trade is better than a bad trade.</td></tr>':'<tr><td colspan=12 class="r">No prices could be loaded, so nothing was analysed. Free proxies are blocked: set up the GitHub data feed.</td></tr>'):'<tr><td colspan=12 class="m">Press “Scan” to load live data.</td></tr>'}</table>
${P&&P.fails.length?`<div class="m">Could not load: ${P.fails.join(', ')}</div>`:''}</div>`}
const manual=(mk,i)=>{msg(addPos(mk,i,0)?'Added to paper trading':'Not added (already open, or not enough paper cash)');save();R()};
function paperView(){const mk=V.mk,a=acct(mk),c=U[mk].cur,ps=S.pos.filter(p=>p.mk==mk).sort((x,y)=>y.id-x.id),A=ps.filter(p=>p.st=='OPEN'||p.st=='PENDING'),C=ps.filter(p=>p.st=='CLOSED'||p.st=='CANCELLED');
 const k=(l,v,cls='')=>`<div class="k">${l}<b class="${cls}">${v}</b></div>`;
 const stg=p=>p.st=='PENDING'?'Waiting for breakout':['Initial stop','Profit locked','Half sold + trailing'][p.stage];
 return`<div class="row"><button class="pri" onclick="refresh()">↻ Refresh prices & check stops</button><button onclick="if(confirm('Delete all ${mk} paper trades?')){S.pos=S.pos.filter(p=>p.mk!='${mk}');save();R()}">Reset ${mk}</button></div>
<div class="grid">${k('Equity',c+f(a.eq))}${k('Realized P&L',c+f(a.real),cl(a.real))}${k('Open P&L',c+f(a.un),cl(a.un))}${k('Free cash',c+f(a.free))}${k('Win rate',a.n?Math.round(a.w/a.n*100)+'% ('+a.n+')':'–')}${k('Active',a.open+' / '+S.set.maxOpen)}</div>
<div class="card"><h3>Active trades</h3><table><tr><th>Stock</th><th class="l">Setup</th><th class="l">Status</th><th>Qty</th><th>Entry</th><th>Now</th><th>Stop</th><th>T1</th><th>T2</th><th>P&L</th><th></th></tr>
${A.map(p=>{const pl=p.real+((p.px||p.entry)-p.entry)*(p.st=='OPEN'?p.rem:0);return`<tr title="${p.log.join(' | ')}"><td><b>${p.sym}</b></td><td class="l">${p.type}</td><td class="l y">${stg(p)}</td><td>${p.rem}</td><td>${f(p.entry)}</td><td>${f(p.px)}</td><td class="${p.sl>=p.entry?'g':'r'}">${f(p.sl)}</td><td>${f(p.t1)}</td><td>${f(p.t2)}</td><td class="${cl(pl)}">${p.st=='OPEN'?f(pl):'–'}</td><td><button onclick="closeNow(${p.id})">Close</button></td></tr>`}).join('')||'<tr><td colspan=11 class="m">No active trades. Run a scan: picks scoring above your minimum are added automatically.</td></tr>'}</table><div class="m">Hover a row for its history. Stop turns green once it sits above entry = minimum profit is guaranteed.</div></div>
<div class="card"><h3>Closed trades</h3><table><tr><th>Stock</th><th class="l">Setup</th><th class="l">Result</th><th>Entry</th><th>Exit</th><th>P&L</th></tr>
${C.map(p=>`<tr><td><b>${p.sym}</b></td><td class="l">${p.type}</td><td class="l">${p.why||'Cancelled'}</td><td>${f(p.entry)}</td><td>${p.exit?f(p.exit):'–'}</td><td class="${cl(p.real)}">${f(p.real)}</td></tr>`).join('')||'<tr><td colspan=6 class="m">Nothing closed yet.</td></tr>'}</table></div>`}
function closeNow(id){const p=S.pos.find(x=>x.id==id);if(p.st=='OPEN')exit(p,p.px||p.entry,'Closed manually');else{p.st='CANCELLED'}save();R()}
function setView(){const s=S.set,g=s.gh,i=(id,l,v,t='number')=>`<div><label>${l}</label><input id="${id}" type="${t}" step="any" value="${v}"></div>`;
 return`<div class="card"><h3>Paper trading rules</h3><div class="f">${i('capIND','India paper capital (₹)',s.capIND)}${i('capUS','US paper capital ($)',s.capUS)}${i('risk','Risk per trade (% of capital)',s.risk)}${i('maxOpen','Max active trades per market',s.maxOpen)}${i('minScore','Auto-add minimum score',s.minScore)}${i('lock','Profit lock at +0.8R (× risk)',s.lock)}${i('trail','Trailing distance (× ATR)',s.trail)}<div><label>Auto-add picks</label><select id="auto"><option value="1" ${s.auto?'selected':''}>ON</option><option value="0" ${s.auto?'':'selected'}>OFF</option></select></div></div>
<p class="m">Position size = risk amount ÷ (Entry − SL). Example: 1% risk on ₹10,00,000 = ₹10,000 max loss if SL hits. “R” = that distance from Entry to SL. T1 = +1.5R, T2 = +3R.<br><b>Trailing logic:</b> at +0.8R the stop jumps above entry (locks a small profit even if the target is never reached). At T1, half is sold and the stop moves to +0.75R. After that it trails the highest price by ${s.trail}×ATR (average daily range) until stopped or T2.</p></div>
<div class="card"><h3>GitHub sync (backs up paper trades to your repo)</h3><div class="f">${i('gtok','Fine-grained token (Contents: read/write)',g.tok,'password')}${i('grepo','Repo (user/repo)',g.repo,'text')}${i('gpath','File path',g.path,'text')}${i('gbr','Branch',g.branch,'text')}</div>
<div class="row" style="margin-top:8px"><button class="pri" onclick="saveSet()">💾 Save settings</button><button onclick="ghSync('PUT')">⬆ Push to GitHub</button><button onclick="ghSync('GET')">⬇ Pull from GitHub</button><button onclick="installFeed()">🛠 Install data feed</button><button onclick="runFeed()">▶ Run feed now</button><span class="m" id="st"></span></div>
<p class="m">Use a <b>private</b> repo and a token limited to that one repo. The token stays only in this browser. For the one-click data feed the token also needs <b>Workflows</b> and <b>Actions</b> = Read and write.</p></div>`}
function saveSet(){const s=S.set,n=id=>parseFloat($('#'+id).value),t=id=>$('#'+id).value.trim();
 Object.assign(s,{capIND:n('capIND'),capUS:n('capUS'),risk:n('risk'),maxOpen:n('maxOpen'),minScore:n('minScore'),lock:n('lock'),trail:n('trail'),auto:+$('#auto').value});
 s.gh={tok:$('#gtok').value.trim(),repo:t('grepo'),path:t('gpath'),branch:t('gbr')||'main'};save();msg('Settings saved')}
async function ghSync(m){saveSet();const g=S.set.gh;if(!g.tok||!g.repo)return msg('Add token and repo first');
 const u=`https://api.github.com/repos/${g.repo}/contents/${g.path}`,h={Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'};
 try{const r=await fetch(u+'?ref='+g.branch+'&t='+Date.now(),{headers:h,cache:'no-store'});let sha;if(r.ok){const j=await r.json();sha=j.sha;
  if(m=='GET'){S.pos=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))).pos;save();return msg('Pulled '+S.pos.length+' trades from GitHub')}}
  else if(m=='GET')throw new Error('File not found ('+r.status+')');
  const body={message:'Paper trades sync '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify({saved:Date.now(),pos:S.pos},null,1)))),branch:g.branch};if(sha)body.sha=sha;
  const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!p.ok)throw new Error('GitHub error '+p.status);msg('Pushed to GitHub ✔')}
 catch(e){msg('GitHub: '+e.message)}}
const YML=`name: Fetch market data
on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: mkdir -p data && python scripts/fetch_data.py
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data update" && git push)
`;
const PYS=()=>`import json, time, datetime
import yfinance as yf
LISTS = {"IND": ("${U.IND.list.join(',')}".split(","), ".NS", "^NSEI"), "US": ("${U.US.list.join(',')}".split(","), "", "^GSPC")}
def n(x):
    return x if isinstance(x, (int, float)) and x == x else None
def fund(t):
    try:
        tk = yf.Ticker(t)
        i = tk.info
        ed = None
        try:
            e = [x for x in tk.calendar.get("Earnings Date", []) if x >= datetime.date.today()]
            ed = str(e[0]) if e else None
        except Exception:
            pass
        time.sleep(0.2)
        return {"eg": n(i.get("earningsGrowth")), "rg": n(i.get("revenueGrowth")), "roe": n(i.get("returnOnEquity")), "de": n(i.get("debtToEquity")), "pm": n(i.get("profitMargins")), "ed": ed}
    except Exception:
        return None
for name, (syms, sfx, ix) in LISTS.items():
    tk = [s + sfx for s in syms]
    df = yf.download(tk, period="1y", interval="1d", group_by="ticker", auto_adjust=False, threads=True, progress=False)
    out = {}
    for s, t in zip(syms, tk):
        try:
            d = df[t].dropna(subset=["Close", "High", "Low"])
            if len(d) < 70:
                continue
            out[s] = {"c": [round(float(x), 2) for x in d.Close], "h": [round(float(x), 2) for x in d.High], "l": [round(float(x), 2) for x in d.Low], "v": [int(x) for x in d.Volume.fillna(0)], "last": round(float(d.Close.iloc[-1]), 2), "f": fund(t)}
        except Exception as e:
            print("skip", s, e)
    idx = [round(float(x), 2) for x in yf.Ticker(ix).history(period="1y")["Close"].dropna()]
    with open(f"data/{name}.json", "w") as f:
        json.dump({"t": int(time.time()), "i": idx, "s": out}, f, separators=(",", ":"))
    print(name, len(out), "symbols,", len(idx), "index bars")
`;
async function ghPut(path,text,m){const g=S.set.gh,u=`https://api.github.com/repos/${g.repo}/contents/${path}`,h={Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'};
 const r=await fetch(u+'?ref='+g.branch+'&t='+Date.now(),{headers:h,cache:'no-store'}),b={message:m,content:btoa(unescape(encodeURIComponent(text))),branch:g.branch};if(r.ok)b.sha=(await r.json()).sha;
 const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)});if(!p.ok)throw new Error(path+': GitHub '+p.status+(p.status>=403?' (token needs Workflows permission)':''))}
async function installFeed(){saveSet();const g=S.set.gh;if(!g.tok||!g.repo)return msg('Add token and repo first');
 try{msg('Installing…');await ghPut('scripts/fetch_data.py',PYS(),'Add data fetch script');await ghPut('.github/workflows/fetch-data.yml',YML,'Add data feed workflow');msg('Feed installed ✔ Now click ▶ Run feed now')}catch(e){msg('Install failed: '+e.message)}}
async function runFeed(){saveSet();const g=S.set.gh;if(!g.tok||!g.repo)return msg('Add token and repo first');
 try{const r=await fetch(`https://api.github.com/repos/${g.repo}/actions/workflows/fetch-data.yml/dispatches`,{method:'POST',headers:{Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'},body:JSON.stringify({ref:g.branch})});
  msg(r.status==204?'Feed started. Wait ~1 minute, then scan.':'Could not start ('+r.status+'). In the repo: Actions → Fetch market data → Run workflow.')}catch(e){msg('Failed: '+e.message)}}
function R(){$('#tabs').innerHTML=[['picks','Auto-Picks'],['paper','Paper Trading'],['set','Settings & GitHub']].map(([k,l])=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';R()">${l}</button>`).join('');
 $('#app').innerHTML=V.tab=='set'?setView():mkBar()+(V.tab=='picks'?picksView():paperView())}
R();setInterval(()=>{if(S.pos.some(p=>p.st=='OPEN'||p.st=='PENDING'))refresh()},300000);
if(!S.picks.IND)scan('IND');
