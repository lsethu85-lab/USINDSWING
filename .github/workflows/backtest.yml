name: Backtest
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install yfinance
      - run: python scripts/hist.py
      - run: node scripts/backtest.js
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet || (git commit -m "backtest update" && (git push || (git pull --rebase -X ours && git push)))
