name: Fetch market data
on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install yfinance
      - run: mkdir -p data && python scripts/fetch_data.py
      - run: node scripts/engine.js
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data paper-trades.json
          git diff --cached --quiet || (git commit -m "data + engine update" && (git push || (git pull --rebase -X ours && git push)))
